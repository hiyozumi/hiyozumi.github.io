  "アイディアは形にすること",
]

[config.home.intro]
title = "the name is "
name = "ズミ"
body = [
  "I'm a software engineer who writes, may it be a piece of code or storytelling, and sometimes do artworks. I have interest in software development, illustration, music, and world building. I enjoy bringing ideas into existence wheter through software or creative works.",
  "This site is my little corner of the internet, a place for things I want to share.",
]

