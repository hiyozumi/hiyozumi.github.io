[config.site]
title = " zumi's site"
description = "A personal space for software, games, art, music, and creative experiments."
pageTitle = "zumi's site"
pageDescription = "Things I make, ideas I explore, and notes from the creative process."
url = "https://hiyozumi.github.io"
repository = "https://github.com/hiyozumi/hiyozumi.github.io"
footerNote = "Made with Astro"

[config.theme]
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "blue-soft"
lang = "en"

[config.fonts]
en = "Maple Mono"
code = "Monaco"
zh = "ChillRoundM"
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search the site..."
maxResults = 6

# --------------------------------------------------
# Blog
# --------------------------------------------------

[config.pages.blog]
title = "Blog"
kicker = "Notes & articles"
subtitle = "Thoughts from the making process."
note = "Development logs, articles, and ideas worth keeping."
postsPerPage = 6
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Explore topics"
subtitle = ""
note = "Browse writing by recurring interests, disciplines, and subjects."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Follow connected ideas and projects through a collection of articles."

# --------------------------------------------------
# Projects
# --------------------------------------------------

[config.pages.projects]
title = "Projects"
kicker = "Things I've made"
subtitle = "Selected Works I'VE built"
note = "A collection of things I've built and created, may it be software or creative works."

# --------------------------------------------------
# Vibe
# --------------------------------------------------

[config.pages.vibe]
title = "Vibe"
kicker = "Bits & pieces"
subtitle = "Sketches, snippets, and passing thoughts."
note = "Small fragments from experiments, works in progress, inspirations, and things that catch my attention."
showTrail = true

# --------------------------------------------------
# Media
# --------------------------------------------------

[config.pages.media]
title = "Media"
subtitle = "Books, films, music, and other things that stay with me."
note = "A personal collection of things I've read, watched, listened to, and enjoyed."

# --------------------------------------------------
# Comments
# --------------------------------------------------

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

# --------------------------------------------------
# Profile
# --------------------------------------------------

[config.profile]
name = "ズミ"
handle = "hiyozumi"
role = "Writer & Creator"
email = "akihisahyo@gmail.com"
website = "https://hiyozumi.github.io/"
github = "https://github.com/hiyozumi"
avatar = "/images/avatar.webp"

